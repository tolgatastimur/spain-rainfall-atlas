<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İspanya Yağış Atlası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<style>
:root{
  --bg:#F2F4F4; --ink:#1A2226; --muted:#7B878C; --faint:#A9B3B7; --line:#DCE2E4; --accent:#2E6E9E;
  --dry:#A0622A; --wet:#1F7A80;
  --land:#E6E1D6; --rain:#6FA3C4; --mm-zero:#E8DDC4; --ratio-mid:#ECE9E0; --shadow-a:.10;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121819; --ink:#E3E8E9; --muted:#8A979B; --faint:#56646A; --line:#263134; --accent:#7DB8DC;
    --dry:#D9A06A; --wet:#6CC6C4;
    --land:#2C3131; --rain:#8DBFDD; --mm-zero:#7D7766; --ratio-mid:#A9A79E; --shadow-a:.35;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121819; --ink:#E3E8E9; --muted:#8A979B; --faint:#56646A; --line:#263134; --accent:#7DB8DC;
  --dry:#D9A06A; --wet:#6CC6C4;
  --land:#2C3131; --rain:#8DBFDD; --mm-zero:#7D7766; --ratio-mid:#A9A79E; --shadow-a:.35;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px;border-radius:4px}
.lab{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;transition:opacity .3s}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:.72;white-space:nowrap;text-shadow:0 0 4px var(--bg),0 0 8px var(--bg);padding:2px 4px}
.lbl:hover{opacity:1;text-decoration:underline}
.crumbs{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;margin-top:14px;font-size:13px}
.crumbs button{color:var(--muted);border-bottom:1px solid var(--line)}
.crumbs button:hover{color:var(--ink)}
.crumbs .cur{color:var(--ink);font-weight:500}
.crumbs .sep{color:var(--faint)}
.crumbs .hint{flex-basis:100%;color:var(--muted);font-size:12px;margin-top:2px}
.side .area{margin-bottom:6px}
.units{display:grid;gap:2px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);max-height:34vh;overflow:auto}
.units .lab{margin-bottom:4px}
.units button{display:grid;grid-template-columns:8px 1fr auto 52px;gap:8px;align-items:center;text-align:left;font-size:12.5px;padding:3px 0}
.units button i{width:8px;height:8px;border-radius:50%}
.units button .v{color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.units button b{font-family:var(--f-mono);font-weight:500;text-align:right}
.units button:hover span:nth-of-type(1){text-decoration:underline}
.tip .go{margin-top:6px;color:var(--ink);font-size:11.5px}
body.busy #stage canvas{cursor:progress}
.toprow{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.tg.lang{gap:10px}
.tg.lang button{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em}

.head{position:absolute;top:28px;left:32px;max-width:340px}
h1{font-weight:500;font-size:22px;letter-spacing:-.01em;margin:8px 0 6px;line-height:1.2}
.head p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}

.tg{display:inline-flex;gap:16px}
.tg button{font-size:13px;color:var(--muted);padding:2px 0;border-bottom:1.5px solid transparent;transition:color .2s,border-color .2s}
.tg button:hover{color:var(--ink)}
.tg button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}

.side{position:absolute;top:28px;right:32px;width:220px;display:grid;gap:22px;text-align:right}
.period{font-size:15px;font-weight:500}
.period small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
.big{font-family:var(--f-mono);font-size:44px;font-weight:400;letter-spacing:-.03em;line-height:1;margin-top:10px}
.big u{text-decoration:none;font-size:14px;color:var(--muted);margin-left:4px;letter-spacing:0}
.ratio{margin-top:8px;font-size:13px;color:var(--muted)}
.ratio b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.ratio b.dry{color:var(--dry)} .ratio b.wet{color:var(--wet)}
.legend{display:grid;gap:8px;justify-items:end}
.legend canvas{width:100%;height:6px;border-radius:3px;display:block}
.ticks{position:relative;height:14px;width:100%;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticks span:first-child{transform:none}
.ticks span:last-child{transform:translateX(-100%)}
.lnote{font-size:11.5px;line-height:1.45;color:var(--muted);margin-top:2px}

.dock{position:absolute;left:32px;right:32px;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.controls{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.play{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none;transition:transform .15s}
.play:hover{transform:scale(1.06)}
.play svg{width:14px;height:14px}
.steps{display:flex;gap:4px;margin-left:-12px}
.steps button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.steps button:hover{color:var(--ink)}
.steps svg{width:10px;height:10px}
.status{font-size:12.5px;color:var(--muted);margin-left:auto}
.status b{color:var(--ink);font-weight:500}
.story-link{font-size:13px;color:var(--ink);border-bottom:1.5px solid var(--ink);padding-bottom:1px}

.timeline{position:relative;padding-top:24px}
.bars{position:absolute;left:7px;right:7px;top:0;height:20px;display:flex;align-items:flex-end;gap:2px}
.bars i{flex:1;border-radius:1px;min-height:2px;cursor:pointer;opacity:.7;transition:opacity .2s}
.bars i:hover,.bars i.cur{opacity:1}
.bars i.cur{box-shadow:0 -3px 0 -1px var(--ink)}
.bars .nline{position:absolute;left:0;right:0;border-top:1px dotted var(--faint);pointer-events:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;display:block}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--ink) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--ink);margin-top:-6px}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.years{position:relative;height:14px;margin:4px 7px 0;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.years span{position:absolute;transform:translateX(-50%)}

.tip{position:absolute;pointer-events:none;padding:10px 12px;font-size:12px;min-width:160px;transform:translate(16px,-50%);border-radius:8px;z-index:5;background:var(--bg);border:1px solid var(--line)}
.tip b{font-weight:600;display:block;margin-bottom:4px;font-size:13px}
.tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--muted)}
.tip .r span:last-child{color:var(--ink);font-family:var(--f-mono)}

.toast{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);text-align:center;font-size:20px;font-weight:500;transition:opacity .5s;pointer-events:none}
.toast small{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:4px}

.loader{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;transition:opacity .6s}
.loader .box{display:grid;gap:12px;justify-items:center;text-align:center;padding-inline:16px}
.pbar{width:180px;height:2px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}

/* ---------- story ---------- */
.story{position:absolute;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.story-top{display:flex;align-items:center;gap:20px;padding:calc(24px + env(safe-area-inset-top,0px)) 32px 8px}
.story-top .lab{margin-right:auto}
.dots{display:flex;gap:6px}
.dots button{width:22px;height:2px;background:var(--line);position:relative;overflow:hidden}
.dots button.on{background:var(--ink)}
.dots button.cur::after{content:"";position:absolute;inset:0;background:var(--ink);transform-origin:left;animation:fillx var(--dur,14s) linear forwards}
.dots.paused button.cur::after{animation:none;transform:scaleX(1)}
@keyframes fillx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.close{font-size:13px;color:var(--muted)} .close:hover{color:var(--ink)}
.scenes{flex:1;position:relative;overflow:hidden}
.scene{position:absolute;inset:0;overflow-y:auto;padding:16px 32px 24px;display:none}
.scene.on{display:block}
.scene-in{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:64px;align-items:center;min-height:100%}
.scene-wide{max-width:1000px;margin:0 auto;padding-block:24px}
.scene h2{font-weight:500;font-size:clamp(26px,3.4vw,40px);line-height:1.12;letter-spacing:-.02em;margin:12px 0 18px;text-wrap:balance}
.scene p{font-size:15.5px;line-height:1.6;margin:0 0 12px;max-width:52ch}
.scene p.m{color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;margin-top:22px}
.kpi{border-top:1px solid var(--line);padding-top:10px}
.kpi b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:400;letter-spacing:-.02em}
.kpi span{font-size:12.5px;color:var(--muted);line-height:1.4;display:block;margin-top:2px}
.story-nav{display:flex;justify-content:space-between;align-items:center;padding:10px 32px calc(24px + env(safe-area-inset-bottom,0px))}
.nav-btn{font-size:14px;color:var(--muted)} .nav-btn:hover{color:var(--ink)} .nav-btn:disabled{opacity:.3;cursor:default}
.nav-btn.pri{color:var(--ink);font-weight:500}
.btn{border-radius:999px;padding:10px 18px;font-size:14px;background:var(--ink);color:var(--bg)}
.btn.sec{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.src,.src p{font-size:12px;color:var(--muted);line-height:1.6}
.src b{color:var(--ink);font-weight:500}

.rise{opacity:0;transform:translateY(10px)}
.scene.on .rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{to{opacity:1;transform:none}}
.chart50 .yb{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0)}
.scene.on .chart50 .yb{animation:grow .7s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i) * 25ms + .2s)}
@keyframes grow{to{transform:scaleY(1)}}
.chart50 .trend{stroke-dasharray:1000;stroke-dashoffset:1000}
.scene.on .chart50 .trend{animation:draw 1.4s ease forwards 1.8s}
@keyframes draw{to{stroke-dashoffset:0}}
.chart50 text{fill:var(--muted);font-family:var(--f-mono);font-size:10.5px}

.use{display:grid;gap:18px}
.use .row{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:14px;font-size:14px}
.use .trk{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.use .fill{height:100%;width:0;border-radius:3px;background:var(--accent)}
.scene.on .use .fill{animation:wid 1.4s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d)}
@keyframes wid{to{width:var(--w)}}
.use .pc{font-family:var(--f-mono);text-align:right;color:var(--muted)}
.glass-wrap{display:flex;gap:24px;align-items:center;margin-top:40px}
.glass{width:64px;flex:none}
.glass .water{transform:translateY(100%)}
.scene.on .glass .water{animation:fillup 2.4s cubic-bezier(.3,.6,.2,1) forwards .6s}
@keyframes fillup{to{transform:translateY(10%)}}
.wave{animation:wave 2.4s linear infinite}
@keyframes wave{to{transform:translateX(-50px)}}
.result{font-family:var(--f-mono);font-size:clamp(30px,3.6vw,42px);font-weight:400;letter-spacing:-.03em;line-height:1}
.result small{display:block;font-family:var(--f-body);font-size:13.5px;color:var(--muted);margin-top:10px;letter-spacing:0;line-height:1.5}

.dam svg{width:100%;height:auto;display:block}
.stat-list{display:grid;margin-top:8px}
.stat-list div{display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.stat-list b{font-family:var(--f-mono);font-size:18px;font-weight:400;color:var(--dry)}
.stat-list span{font-size:14px;line-height:1.5}

.sols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 36px;margin-top:8px}
.sol{border-top:1px solid var(--line);padding-top:14px}
.sol h4{margin:0 0 6px;font-size:15px;font-weight:600}
.sol p{font-size:13px;line-height:1.55;margin:0;color:var(--muted)}
.sol .n{font-family:var(--f-mono);font-size:11px;color:var(--faint);display:block;margin-bottom:8px}

.calc{display:grid;gap:18px}
.calc label{display:grid;gap:8px;font-size:14px}
.calc .lr{display:flex;justify-content:space-between;gap:8px}
.calc .lr span:last-child{font-family:var(--f-mono)}
.calc .tog{display:flex;align-items:center;gap:10px}
.calc .tog input{width:16px;height:16px;accent-color:var(--ink)}
.calc .result{margin-top:10px;padding-top:18px;border-top:1px solid var(--line)}

@media (max-width:760px){
  .head{top:18px;left:16px;right:16px;max-width:none}
  .head p{display:none}
  .units{display:none}
  h1{font-size:18px}
  .side{top:auto;left:16px;right:16px;width:auto;bottom:calc(var(--dock-h,120px) + 36px);text-align:left;gap:12px;grid-template-columns:1fr auto;align-items:end}
  .side .legend{width:150px}
  .big{font-size:30px;margin-top:6px}
  .dock{left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));gap:10px}
  .controls{gap:14px}
  .status{display:none}
  .scene{padding-inline:16px}
  .story-top,.story-nav{padding-inline:16px}
  .scene-in{grid-template-columns:1fr;gap:24px}
  .sols{grid-template-columns:1fr;gap:18px}
  .use .row{grid-template-columns:96px 1fr 40px}
  .dots button{width:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}
}
</style>

<div id="app">
  <div id="stage" data-i18n-aria="ariaStage"></div>
  <div class="labels" id="labels"></div>

  <header class="head">
    <div class="toprow"><span class="lab" data-i18n="eyebrow"></span>
      <div class="tg lang" role="group" aria-label="Language">
        <button data-lang="tr" aria-pressed="false">TR</button><button data-lang="en" aria-pressed="false">EN</button><button data-lang="es" aria-pressed="false">ES</button>
      </div></div>
    <h1 data-i18n="title"></h1>
    <p data-i18n="lede"></p>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  </header>

  <aside class="side" aria-live="polite">
    <div>
      <div class="lab area" id="c-area"></div>
      <div class="period" id="c-period">—</div>
      <div class="big" id="c-mm">—</div>
      <div class="ratio" id="c-ratio"></div>
      <div class="units" id="c-units" hidden></div>
    </div>
    <div class="legend">
      <div class="tg" role="group" data-i18n-aria="ariaMetric">
        <button id="m-mm" aria-pressed="true" data-i18n="mAmount"></button>
        <button id="m-ratio" aria-pressed="false" data-i18n="mRatio"></button>
      </div>
      <canvas id="lg" width="440" height="12"></canvas>
      <div class="ticks" id="lg-ticks"></div>
      <div class="lnote" data-i18n="normalNote"></div>
    </div>
  </aside>

  <div class="dock">
    <div class="controls">
      <button class="play" id="play" data-i18n-aria="play"><svg viewBox="0 0 20 20" id="play-ico"><path d="M5 3.5v13l11-6.5z" fill="currentColor"/></svg></button>
      <div class="steps">
        <button id="prev" data-i18n-aria="prev"><svg viewBox="0 0 12 12"><path d="M8 1 3 6l5 5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></button>
        <button id="next" data-i18n-aria="next"><svg viewBox="0 0 12 12"><path d="m4 1 5 5-5 5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></button>
      </div>
      <div class="tg" role="group" data-i18n-aria="ariaStep">
        <button data-g="day" aria-pressed="false" data-i18n="gDay"></button>
        <button data-g="week" aria-pressed="false" data-i18n="gWeek"></button>
        <button data-g="month" aria-pressed="false" data-i18n="gMonth"></button>
        <button data-g="year" aria-pressed="true" data-i18n="gYear"></button>
      </div>
      <div class="tg" role="group" data-i18n-aria="ariaSpeed">
        <button data-s="1" aria-pressed="true">1×</button>
        <button data-s="4" aria-pressed="false">4×</button>
        <button data-s="16" aria-pressed="false">16×</button>
      </div>
      <span class="status" id="status"></span>
      <button class="story-link" id="open-story" data-i18n="storyLink"></button>
    </div>
    <div class="timeline">
      <div class="bars" id="bars"></div>
      <input type="range" id="slider" min="0" max="1" step="1" value="0" data-i18n-aria="ariaTime">
      <div class="years" id="years"></div>
    </div>
  </div>

  <div class="tip" id="tip" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <div class="loader" id="loader">
    <div class="box">
      <div class="lab" data-i18n="loading"></div>
      <div class="pbar"><i id="pbar"></i></div>
      <div class="lab" id="ptext" style="text-transform:none;letter-spacing:0" data-i18n="loadingSub"></div>
    </div>
  </div>

  <section class="story" id="story" hidden data-i18n-aria="ariaStory">
    <div class="story-top">
      <span class="lab" data-i18n="storyTop"></span>
      <div class="dots" id="dots"></div>
      <button class="close" id="close-story" data-i18n="close"></button>
    </div>
    <div class="scenes" id="scenes">

      <article class="scene">
        <div class="scene-in">
          <div>
            <div class="lab rise" data-i18n="s1lab"></div>
            <h2 class="rise" style="--d:.1s" id="s1-h"></h2>
            <p class="rise" style="--d:.25s" id="s1-a"></p>
            <p class="rise" style="--d:.4s" id="s1-b"></p>
            <div class="kpis">
              <div class="kpi rise" style="--d:.55s"><b id="k-normal">—</b><span data-i18n="kNormal"></span></div>
              <div class="kpi rise" style="--d:.65s"><b id="k-trend">—</b><span data-i18n="kTrend"></span></div>
              <div class="kpi rise" style="--d:.75s"><b id="k-dry">—</b><span data-i18n="kDry"></span></div>
              <div class="kpi rise" style="--d:.85s"><b id="k-ytd">—</b><span id="k-ytd-l"></span></div>
            </div>
          </div>
          <div class="rise" style="--d:.15s">
            <svg class="chart50" id="chart50" viewBox="0 0 560 300" role="img" data-i18n-aria="chartAria"></svg>
            <p class="m" data-i18n="chartNote"></p>
          </div>
        </div>
      </article>

      <article class="scene">
        <div class="scene-in">
          <div>
            <div class="lab rise" data-i18n="s2lab"></div>
            <h2 class="rise" style="--d:.1s" data-i18n="s2h"></h2>

/* ---------------- data ---------------- */
async function fetchBin(url, onProg){
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ' ' + r.status);
  const total = +r.headers.get('content-length') || 0;
  if (!r.body || !total) return new Uint8Array(await r.arrayBuffer());
  const out = new Uint8Array(total); let got = 0; const rd = r.body.getReader();
  for(;;){ const {done, value} = await rd.read(); if (done) break;
    if (got + value.length > out.length) return new Uint8Array(await (await fetch(url)).arrayBuffer());
    out.set(value, got); got += value.length; onProg(got/total); }
  return got === total ? out : out.slice(0, got);
}
// binaries are shipped as base64 text
async function fetchB64(url, onProg){
  const txt = new TextDecoder().decode(await fetchBin(url, onProg)), bin = atob(txt.trim());
  const out = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i); return out;
}

async function load(){
  let idx;
  [meta, geo, idx] = await Promise.all(['data/meta.json', 'data/geo.json', 'data/detail/index.json'].map(u => fetch(u).then(r => r.json())));
  idx.forEach(e => FILES[e.name] = e.file);
  const [d, c] = await Promise.all([fetchB64('data/daily.b64.txt', p => $('#pbar').style.width = (p*100).toFixed(0)+'%'), fetchB64('data/clim.b64.txt', ()=>{})]);

  ND = meta.days;
  LUT = new Float32Array(256); for (let q=0;q<256;q++) LUT[q] = (q/meta.q)**2;
  t0 = Date.parse(meta.start + 'T00:00:00Z');
  doyIdx = new Uint16Array(ND);
  for (let i=0;i<ND;i++){ const dt = new Date(t0 + i*DAY), y = dt.getUTCFullYear();
    let n = Math.round((Date.UTC(y, dt.getUTCMonth(), dt.getUTCDate()) - Date.UTC(y,0,1))/DAY);
    if ((y%4===0 && (y%100!==0 || y%400===0)) && n >= 59) n -= 1; doyIdx[i] = n; }
}

const G = {};
function buildPeriods(){
  const mk = () => ({a:[], b:[]});
  G.day = mk(); for (let i=0;i<ND;i++){ G.day.a.push(i); G.day.b.push(i+1); }
  G.week = mk(); { let a = 0; while (new Date(t0+a*DAY).getUTCDay() !== 1) a++; for (;a<ND;a+=7){ G.week.a.push(a); G.week.b.push(Math.min(a+7, ND)); } }
  G.month = mk(); G.year = mk();
  const endY = new Date(t0 + (ND-1)*DAY).getUTCFullYear();
  for (let y=+meta.start.slice(0,4); y<=endY; y++){
    G.year.a.push((Date.UTC(y,0,1)-t0)/DAY); G.year.b.push(Math.min((Date.UTC(y+1,0,1)-t0)/DAY, ND));
    for (let m=0;m<12;m++){ const a = (Date.UTC(y,m,1)-t0)/DAY; if (a>=ND) break; G.month.a.push(a); G.month.b.push(Math.min((Date.UTC(y,m+1,1)-t0)/DAY, ND)); }
  }
}
const dateOf = i => new Date(t0 + i*DAY);
function label(g, i){
  const a = G[g].a[i], b = G[g].b[i], da = dateOf(a), db = dateOf(b-1);
  const monthEnd = new Date(Date.UTC(db.getUTCFullYear(), db.getUTCMonth()+1, 0)).getUTCDate();
  const upto = dfmt(db, {day:'numeric', month:'long'});
  if (g==='year') return {t: String(da.getUTCFullYear()), s: (b===ND && !(db.getUTCMonth()===11 && db.getUTCDate()===31)) ? t('ytd', upto) : t('yearTotal')};
  if (g==='month') return {t: dfmt(da, {month:'long', year:'numeric'}), s: (b===ND && db.getUTCDate()!==monthEnd) ? t('monthUntil', upto) : t('monthTotal')};
  if (g==='week') return {t: `${dfmt(da, {day:'numeric', month:'short'})} – ${dfmt(db, {day:'numeric', month:'short', year:'numeric'})}`, s: t('weekTotal')};

/* ---------------- values ---------------- */
const VAL = new Float32Array(1024), NOR = new Float32Array(1024), RVAL = new Float32Array(1024), RNOR = new Float32Array(1024);
function sumDays(a, b, out){ out.fill(0, 0, NC); for (let d=a; d<b; d++){ const o = d*NC; for (let c=0;c<NC;c++) out[c] += LUT[D[o+c]]; } }
function sumNorm(a, b, out){ out.fill(0, 0, NC); for (let d=a; d<b; d++){ const o = doyIdx[d]*NC; for (let c=0;c<NC;c++) out[c] += CL[o+c]/100; } }
function compute(g, i){
  const a = G[g].a[i], b = G[g].b[i];
  if (g === 'year'){
    const y = YEARLY[i]; for (let c=0;c<NC;c++) VAL[c] = y[c];
    if (b - a >= 365) for (let c=0;c<NC;c++) NOR[c] = NORMALC[c]; else sumNorm(a, b, NOR);
    RVAL.set(VAL.subarray(0,NC)); RNOR.set(NOR.subarray(0,NC));
  } else {
    sumDays(a, b, VAL); sumNorm(a, b, NOR);
    if (g === 'day'){ const ra = Math.max(0, a-29); sumDays(ra, b, RVAL); sumNorm(ra, b, RNOR); }
    else { RVAL.set(VAL.subarray(0,NC)); RNOR.set(NOR.subarray(0,NC)); }
  }
  let nv=0, nn=0, rv=0, rn=0; for (let c=0;c<NC;c++){ nv += W[c]*VAL[c]; nn += W[c]*NOR[c]; rv += W[c]*RVAL[c]; rn += W[c]*RNOR[c]; }
  return {nat: nv, natNorm: nn, natRatio: rv/Math.max(rn, 1e-6)};
}

function ramp(stops, t, out){
  if (t <= stops[0][0]) { out[0]=stops[0][1][0]; out[1]=stops[0][1][1]; out[2]=stops[0][1][2]; return out; }
  for (let k=1;k<stops.length;k++){ if (t <= stops[k][0]){ const [a,c0] = stops[k-1], [b,c1] = stops[k]; const f = (t-a)/(b-a);
      out[0]=c0[0]+(c1[0]-c0[0])*f; out[1]=c0[1]+(c1[1]-c0[1])*f; out[2]=c0[2]+(c1[2]-c0[2])*f; return out; } }
  const l = stops[stops.length-1][1]; out[0]=l[0]; out[1]=l[1]; out[2]=l[2]; return out;
}
const VMAX = {day:40, week:110, month:240, year:1600};

    GROUPS.forEach((g, gi) => { if (gi) g.rings.forEach(ring => outer.push([gi, ring])); });
    frames = buildFrames();
  } else {
    const j = spec.data;

    rings.forEach(ring => outer.push([0, ring]));

    const gi = GROUPS.findIndex(g => g.frame && pt.x > g.box[0]-.28 && pt.x < g.box[1]+.28 && pt.z > g.box[2]-.28 && pt.z < g.box[3]+.28);
    if (gi >= 0) hit = {point: pt, object: GROUPS[gi].mesh};

const ICON_PLAY = '<path d="M5 3.5v13l11-6.5z" fill="currentColor"/>', ICON_PAUSE = '<rect x="4" y="3" width="4" height="14" rx="1" fill="currentColor"/><rect x="12" y="3" width="4" height="14" rx="1" fill="currentColor"/>';

/* ---------------- loop ---------------- */
let lastT = performance.now();
function frame(now){

      state.i = Math.min(last, state.i + steps); refresh(false); if (state.i >= last) reachedEnd(); }
  }
  if (state.moving){
    const k = reduced ? 1 : 1 - Math.exp(-dt * (state.playing ? 5 + state.speed : 4));
    let md = 0;
    for (let c=0;c<NC;c++){ const d = tgtH[c] - curH[c]; curH[c] += d*k; md = Math.max(md, Math.abs(d));
      for (let j=0;j<3;j++){ const e = tgtC[c*3+j] - curC[c*3+j]; curC[c*3+j] += e*k; md = Math.max(md, Math.abs(e)); } }

function pickCell(){ const r = Math.random(); let lo = 0, hi = NC-1; while (lo < hi){ const m = (lo+hi)>>1; if (rainCDF[m] < r) lo = m+1; else hi = m; } return lo; }

  const pos = rain.mesh.geometry.attributes.position.array;
  for (let k=0;k<rain.n;k++){
    const o = k*6;
    if (k >= rain.active){ pos.fill(0, o, o+6); rain.y[k] = -9; continue; }
    if (!GROUPS.length) break;
    if (rain.cell[k] >= NC) rain.cell[k] = 0;
    if (rain.y[k] < surfY(cellG[rain.cell[k]], cellV[rain.cell[k]])){

      rain.y[k] = surfY(cellG[c], cellV[c]) + .8 + Math.random()*2.4; rain.v[k] = 2.6 + Math.random()*1.2;

    b.className = k < sIdx ? 'on' : k === sIdx ? 'cur' : ''; b.style.setProperty('--dur', SCENE_MS[k] + 'ms');

  $('#s-prev').disabled = sIdx === 0; $('#s-next').textContent = sIdx === sc.length-1 ? t('toMap') : t('fwd');
  if (sIdx === 1) countUp($('#lit'), 133, 2400);
  if (sIdx === 2) animateDam();
  clearTimeout(sTimer);
  if (sAuto && sIdx < sc.length-1) sTimer = setTimeout(() => goScene(sIdx+1), SCENE_MS[sIdx]);
}
function pauseAuto(){ sAuto = false; clearTimeout(sTimer); $('#dots').classList.add('paused'); }
function countUp(el, to, ms){ if (reduced){ el.textContent = to; return; } const s = performance.now();
  const f = t => { const p = Math.min(1, (t-s)/ms); el.textContent = Math.round(to * (1 - Math.pow(1-p, 3))); if (p < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }
function animateDam(){
  const w = $('#dam-water'), p = $('#dam-pct'), y = pct => 222 - 172*pct/100, s = performance.now(), from = 72, to = 16, ms = reduced ? 1 : 3200;
  const f = t => { const k = Math.min(1, Math.max(0, (t - s - 500)/ms)), v = from + (to-from)*(1 - Math.pow(1-k, 3));
    w.setAttribute('y', y(v).toFixed(1)); p.textContent = pct(Math.round(v)); if (k < 1 && sIdx === 2) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
function buildStory(){
  const st = meta.stats, nat = meta.national_yearly, years = meta.years, out = [0,0,0];
  const sgn = v => (v > 0 ? '+' : v < 0 ? '−' : '') + fmt(Math.abs(v), Math.abs(v) < 10 ? 1 : 0);
  const tr = st.trend_mm_per_decade;
  $('#s1-h').textContent = t('s1h', tr);
  $('#k-normal').textContent = fmt(st.normal_mm) + ' mm';
  $('#k-trend').textContent = sgn(tr) + ' mm';
  $('#k-dry').textContent = `${st.dry_years_since_2000} / 10`;
  if (st.partial){ const r = st.partial.mm/st.partial.normal_mm, d = new Date(st.partial.through + 'T00:00:00Z');
    $('#k-ytd').textContent = pct(r*100); $('#k-ytd-l').textContent = t('kYtd', st.partial.year, dfmt(d, {day:'numeric', month:'long'}));
  } else { $('#k-ytd').textContent = fmt(nat[nat.length-1]) + ' mm'; $('#k-ytd-l').textContent = t('kYear', years[years.length-1]); }
  const dr = st.driest, wt = st.wettest, diff = st.second_half.mm - st.first_half.mm;
  $('#s1-a').textContent = t('s1a', fmt(st.normal_mm), dr[0].year, fmt(dr[0].mm), wt[0].year, fmt(wt[0].mm));
  $('#s1-b').textContent = t('s1b', st.first_half.from, st.first_half.to, fmt(st.first_half.mm), st.second_half.from, st.second_half.to, fmt(st.second_half.mm), sgn(diff));

  const Wc = 560, Hc = 300, L = 40, R = 8, T = 18, B = 26, full = st.partial ? nat.length-1 : nat.length;
  const vmax = Math.ceil(Math.max(...nat)/100)*100, bw = (Wc-L-R)/nat.length, x = k => L + k*bw, y = v => T + (Hc-T-B)*(1 - v/vmax);
  let h = '';
  for (let v=0; v<=vmax; v+=200) h += `<line x1="${L}" x2="${Wc-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`;
  nat.forEach((v,k) => { const partial = st.partial && k === nat.length-1, ratio = partial ? st.partial.mm/st.partial.normal_mm : v/st.normal_mm;
    h += `<rect class="yb" style="--i:${k}" x="${(x(k)+1).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${(y(0)-y(v)).toFixed(1)}" rx="1" fill="${rgbCss(colorRatio(ratio,out))}" ${partial?'opacity=".4"':''}><title>${years[k]}: ${fmt(v)} mm${partial ? t('chartPartial') : ''}</title></rect>`; });
  h += `<line x1="${L}" x2="${Wc-R}" y1="${y(st.normal_mm)}" y2="${y(st.normal_mm)}" stroke="var(--ink)" stroke-dasharray="2 4" opacity=".6"/>`;
  let sx=0, sy=0, sxx=0, sxy=0; for (let k=0;k<full;k++){ sx+=k; sy+=nat[k]; sxx+=k*k; sxy+=k*nat[k]; }
  const b1 = (full*sxy - sx*sy)/(full*sxx - sx*sx), b0 = (sy - b1*sx)/full;
  h += `<line class="trend" x1="${x(0)+bw/2}" y1="${y(b0)}" x2="${x(full-1)+bw/2}" y2="${y(b0+b1*(full-1))}" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" pathLength="1000"/>`;
  for (let yy = Math.ceil(years[0]/10)*10; yy <= years[years.length-1]; yy += 10) h += `<text x="${x(yy - years[0])+bw/2}" y="${Hc-6}" text-anchor="middle">${yy}</text>`;
  [dr[0], wt[0]].forEach(d => { const k = d.year - years[0]; h += `<text x="${x(k)+bw/2}" y="${y(d.mm)-6}" text-anchor="middle" style="fill:var(--ink)">${d.year}</text>`; });
  $('#chart50').innerHTML = h;
}
function calc(){
  const sh = +$('#c-shower').value, tap = $('#c-tap').checked, full = $('#c-full').checked;
  $('#c-shower-v').textContent = t('min', sh);
  const perDay = sh * 9 + (tap ? 24 : 0) + (full ? 15 : 0), hm3 = perDay * 49e6 * 365 / 1e9;
  $('#c-res').innerHTML = t('cRes', fmt(perDay), fmt(perDay*365), fmt(perDay/133*100), fmt(hm3), fmt(hm3/80,1));
}

/* ---------------- wire ---------------- */
function wire(){
  $('#play').onclick = () => state.playing ? stop() : play();
  $('#prev').onclick = () => { stop(); state.i = Math.max(0, state.i-1); refresh(false); };
  $('#next').onclick = () => { stop(); state.i = Math.min(G[state.g].a.length-1, state.i+1); refresh(false); };
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => setGran(b.dataset.g));
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { state.speed = +b.dataset.s; document.querySelectorAll('[data-s]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#m-mm').onclick = () => setMode('mm'); $('#m-ratio').onclick = () => setMode('ratio');
  $('#slider').addEventListener('input', e => { stop(); state.i = +e.target.value; refresh(false); });
  $('#open-story').onclick = () => { stop(); openStory(); };
  $('#close-story').onclick = closeStory; $('#back-map').onclick = closeStory;
  $('#replay').onclick = () => { closeStory(); setGran('year'); gotoYear(meta.years[0]); toast(t('pickYear'), t('pickYearSub')); };
  $('#s-prev').onclick = () => { pauseAuto(); goScene(sIdx-1); };
  $('#s-next').onclick = () => { pauseAuto(); if (sIdx === document.querySelectorAll('.scene').length-1) closeStory(); else goScene(sIdx+1); };
  ['#c-shower','#c-tap','#c-full'].forEach(s => $(s).addEventListener('input', calc));
  addEventListener('keydown', e => {
    if (!$('#story').hidden){ if (e.key === 'Escape') closeStory(); if (e.key === 'ArrowRight'){ pauseAuto(); goScene(sIdx+1); } if (e.key === 'ArrowLeft'){ pauseAuto(); goScene(sIdx-1); } return; }
    if (e.target.tagName === 'INPUT') return;
    if (e.key === ' '){ e.preventDefault(); state.playing ? stop() : play(); }
    if (e.key === 'Escape' || e.key === 'Backspace') goUp();
  });
  $('#scenes').addEventListener('pointerdown', pauseAuto);
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => setLang(b.dataset.lang));
  const mq = matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener && mq.addEventListener('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
}

function setLang(l){
  LANG = l; try { localStorage.setItem('lang', l); } catch(e){}
  applyStatic();
  if (!state.ready) return;
  drawLegend(); drawBars(); buildStory(); calc(); renderCrumbs(); refresh(false);
  $('#play').setAttribute('aria-label', t(state.playing ? 'pause' : 'play'));
  if (!$('#story').hidden) $('#s-next').textContent = sIdx === document.querySelectorAll('.scene').length-1 ? t('toMap') : t('fwd');
}

(async () => {
  applyStatic();
  try { await load(); }
  catch (e){ $('#ptext').textContent = t('loadErr', e.message); return; }
  buildPeriods(); initScene(); wire();
  state.ready = true;
  buildView({kind:'nation'});
  drawLegend(); buildStory(); calc();
  refresh(true);
  const ld = $('#loader'); ld.style.opacity = 0; setTimeout(() => ld.hidden = true, 600);
  requestAnimationFrame(frame);
})();
})();
</script>
